<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bruce KH Lee - Docking Demos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      font-family: Arial, sans-serif;
    }
    
    .sidebar {
      width: 250px;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      min-height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
    }
    
    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 18px;
    }
    
    .sidebar ul {
      list-style: none;
    }
    
    .sidebar ul li {
      margin-bottom: 15px;
    }
    
    .sidebar ul li a {
      color: #ecf0f1;
      text-decoration: none;
      display: block;
      padding: 10px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    
    .sidebar ul li a:hover {
      background-color: #34495e;
    }
    
    .content {
      margin-left: 250px;
      padding: 40px;
      width: calc(100% - 250px);
    }
    
    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }
    
    p {
      line-height: 1.6;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Navigation</h2>
    <ul>
      <li><a href="#" onclick="loadContent('home')">Home</a></li>
      <li><a href="#" onclick="loadContent('demo_docking/index.html')">Docking Notebook</a></li>
    </ul>
  </div>
  
  <div class="content" id="content">
    <h1>Docking Visualization</h1>
    <p>Welcome to the docking demos and bioinformatics projects.</p>
  </div>
  
  <script>
    function loadContent(path) {
      const contentDiv = document.getElementById('content');
      
      if (path === 'home') {
        contentDiv.innerHTML = `
          <h1>Docking Visualization</h1>
          <p>Welcome to the docking demos and bioinformatics projects.</p>
        `;
      } else {
        fetch(path)
          .then(response => response.text())
          .then(html => {
            // Extract body content from the fetched HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const bodyContent = doc.body.innerHTML;
            contentDiv.innerHTML = bodyContent;
          })
          .catch(error => {
            contentDiv.innerHTML = `<h1>Error</h1><p>Could not load content: ${error}</p>`;
          });
      }
      return false;
    }
  </script>
</body>
</html>
